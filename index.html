<!DOCTYPE html>
<html>
<head>
    <title>ELKS</title>
    <link rel="stylesheet"
        href="https://pyscript.net/releases/2026.6.2/core.css">
    <script type="module"
        src="https://pyscript.net/releases/2026.6.2/core.js"></script>

    <style>
        body {
            background: #000;
            color: #ccc;
            font: 14px monospace;
            margin: 0;
            padding: 12px;
        }

        #terminal {
            white-space: pre-wrap;
            overflow-y: auto;
            height: 85vh;
        }

        #command {
            background: black;
            color: #ccc;
            border: none;
            outline: none;
            font: inherit;
            width: 80%;
        }

        #input-line {
            display: flex;
        }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <div id="input-line">
        <span id="prompt">elks# </span>
        <input id="command" autocomplete="off" autofocus>
    </div>

    <script type="py" src="script.py"></script>
</body>
</html>
